<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon Planning</title>
<style>
*{box-sizing:border-box}
body{
margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:linear-gradient(160deg,#eef2ff,#f8fafc);
color:#0f172a;min-height:100vh
}
.page{
min-height:100vh;padding:20px 15px;
display:flex;align-items:center;justify-content:center
}
.box{
width:100%;max-width:500px;background:white;padding:26px;
border-radius:26px;box-shadow:0 18px 50px rgba(15,23,42,.12)
}
.logo{font-size:30px;margin-bottom:20px}
.small{
font-size:11px;font-weight:800;letter-spacing:.12em;
color:#64748b;text-transform:uppercase
}
h1{font-size:30px;margin:5px 0}
.sub{color:#64748b;font-size:14px;line-height:1.5}
label{display:block;font-weight:700;font-size:13px;margin-top:22px}
input{
width:100%;height:50px;margin-top:8px;padding:12px;
border:1px solid #cbd5e1;border-radius:14px;font-size:16px
}
button{
border:0;border-radius:14px;background:#0f172a;color:white;
font-weight:800;padding:14px;cursor:pointer
}
.go{width:100%;margin-top:13px}
#planning{display:none;align-items:flex-start}
.wrap{width:100%;max-width:760px}
.back{background:white;color:#0f172a;border:1px solid #e2e8f0}
.ref{color:#64748b;font-size:13px;margin:5px 0 15px}
.card{
background:white;border:1px solid #e2e8f0;border-radius:22px;
padding:15px;box-shadow:0 12px 35px rgba(15,23,42,.07)
}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}
.month{font-size:20px;font-weight:900}
.nav{display:flex;gap:7px}
.nav button{width:40px;height:40px;padding:0;font-size:22px}
.week,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.week div{text-align:center;font-size:9px;font-weight:800;color:#94a3b8;padding:5px}
.day{
min-height:68px;border:1px solid #e2e8f0;border-radius:12px;padding:6px
}
.empty{visibility:hidden}
.num{font-size:12px;font-weight:900}
.status{font-size:8px;font-weight:800;line-height:1.15;margin-top:8px}
.rest{background:#dcfce7;color:#15803d}
.jour{background:#dbeafe;color:#1d4ed8}
.nuit{background:#ede9fe;color:#6d28d9}
.selected{outline:3px solid #0f172a;outline-offset:-3px}
.legend{
display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;
font-size:11px;font-weight:700;color:#475569
}
</style>
</head>

<body>

<div class="page" id="accueil">
<div class="box">

<div class="logo">📅</div>

<div class="small">MON PLANNING</div>

<h1>Choisir une date</h1>

<p class="sub">
Choisis la date de ton <b>1er jour de repos</b>.
Ton cycle sera calculé automatiquement.
</p>

<label>Date de départ</label>

<input id="dateDepart" type="date">

<button class="go" onclick="ouvrirPlanning()">
Voir mon planning →
</button>

</div>
</div>


<div class="page" id="planning">

<div class="wrap">

<button class="back" onclick="retour()">
← Changer la date
</button>

<div style="margin-top:15px">

<div class="small">PLANNING CALCULÉ</div>

<h1>Mon calendrier</h1>

<div class="ref" id="reference"></div>

</div>

<div class="card">

<div class="bar">

<div class="month" id="mois"></div>

<div class="nav">
<button onclick="moisPrecedent()">‹</button>
<button onclick="moisSuivant()">›</button>
</div>

</div>

<div class="week">
<div>LUN</div>
<div>MAR</div>
<div>MER</div>
<div>JEU</div>
<div>VEN</div>
<div>SAM</div>
<div>DIM</div>
</div>

<div class="grid" id="calendrier"></div>

<div class="legend">
<span>🟢 Repos</span>
<span>🔵 Service jour</span>
<span>🟣 Service nuit</span>
</div>

</div>

</div>
</div>


<script>

let dateDepart;
let moisActuel;


/* Date du jour */
const maintenant = new Date();

const yyyy = maintenant.getFullYear();
const mm = String(maintenant.getMonth()+1).padStart(2,"0");
const dd = String(maintenant.getDate()).padStart(2,"0");

const champ = document.getElementById("dateDepart");


/* Charger la date mémorisée */
const sauvegarde = localStorage.getItem("datePlanning");

if(sauvegarde){

champ.value = sauvegarde;

}else{

champ.value = "2026-09-17";

}


/* Ouvrir le planning */

function ouvrirPlanning(){

if(!champ.value)return;

localStorage.setItem("datePlanning",champ.value);

const morceaux = champ.value.split("-");

dateDepart = new Date(
Number(morceaux[0]),
Number(morceaux[1])-1,
Number(morceaux[2])
);

moisActuel = new Date(
dateDepart.getFullYear(),
dateDepart.getMonth(),
1
);

document.getElementById("accueil").style.display="none";
document.getElementById("planning").style.display="flex";

afficherCalendrier();

window.scrollTo(0,0);

}


/* Retour */

function retour(){

document.getElementById("planning").style.display="none";
document.getElementById("accueil").style.display="flex";

}


/* Différence entre deux dates */

function difference(a,b){

const aa = new Date(
a.getFullYear(),
a.getMonth(),
a.getDate()
);

const bb = new Date(
b.getFullYear(),
b.getMonth(),
b.getDate()
);

return Math.round((aa-bb)/86400000);

}


/* Calcul du cycle */

function obtenirStatut(date){

let n =
(difference(date,dateDepart)%9+9)%9;

if(n<3){

return {
nom:"Repos",
numero:n+1,
classe:"rest"
};

}

if(n<6){

return {
nom:"Service jour",
numero:n-2,
classe:"jour"
};

}

return {
nom:"Service nuit",
numero:n-5,
classe:"nuit"
};

}


/* Afficher calendrier */

function afficherCalendrier(){

let titre =
moisActuel.toLocaleDateString(
"fr-FR",
{
month:"long",
year:"numeric"
}
);

document.getElementById("mois").textContent =
titre.charAt(0).toUpperCase()+titre.slice(1);


document.getElementById("reference").textContent =
"1er jour de repos : "+
dateDepart.toLocaleDateString(
"fr-FR",
{
day:"numeric",
month:"long",
year:"numeric"
}
);


const calendrier =
document.getElementById("calendrier");

calendrier.innerHTML="";


const premier =
new Date(
moisActuel.getFullYear(),
moisActuel.getMonth(),
1
);

const dernier =
new Date(
moisActuel.getFullYear(),
moisActuel.getMonth()+1,
0
);


const decalage =
(premier.getDay()+6)%7;


/* Cases avant le 1er jour */

for(let i=0;i<decalage;i++){

const vide=document.createElement("div");

vide.className="day empty";

calendrier.appendChild(vide);

}


/* Jours */

for(let jour=1;jour<=dernier.getDate();jour++){

const date =
new Date(
moisActuel.getFullYear(),
moisActuel.getMonth(),
jour
);

const statut =
obtenirStatut(date);


const cellule =
document.createElement("div");

cellule.className =
"day "+statut.classe;


if(difference(date,dateDepart)===0){

cellule.classList.add("selected");

}


cellule.innerHTML =
"<div class='num'>"+jour+"</div>"+
"<div class='status'>"+
statut.nom+
"<br>"+
statut.numero+
"/3"+
"</div>";


calendrier.appendChild(cellule);

}

}


/* Mois précédent */

function moisPrecedent(){

moisActuel =
new Date(
moisActuel.getFullYear(),
moisActuel.getMonth()-1,
1
);

afficherCalendrier();

}


/* Mois suivant */

function moisSuivant(){

moisActuel =
new Date(
moisActuel.getFullYear(),
moisActuel.getMonth()+1,
1
);

afficherCalendrier();

}


/* Si une date existe déjà,
on peut la réutiliser automatiquement */

if(sauvegarde){

const morceaux=sauvegarde.split("-");

dateDepart=new Date(
Number(morceaux[0]),
Number(morceaux[1])-1,
Number(morceaux[2])
);

}

</script>

</body>
</html>
