<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon Planning</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f4f6f8;
  color: #17202a;
}

.page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.card {
  width: 100%;
  max-width: 420px;
  background: white;
  border-radius: 24px;
  padding: 30px 22px;
  text-align: center;
  box-shadow: 0 10px 35px rgba(0,0,0,0.08);
}

h1 {
  margin-top: 0;
  font-size: 30px;
}

p {
  color: #667085;
  font-size: 16px;
}

input {
  width: 100%;
  padding: 16px;
  margin: 18px 0;
  border: 1px solid #d0d5dd;
  border-radius: 14px;
  font-size: 18px;
}

button {
  width: 100%;
  border: 0;
  border-radius: 14px;
  padding: 16px;
  font-size: 18px;
  font-weight: 600;
  background: #111827;
  color: white;
}

.result {
  font-size: 32px;
  font-weight: 700;
  margin: 35px 0;
  line-height: 1.4;
}

.date {
  font-size: 17px;
  color: #667085;
  margin-bottom: 20px;
}

.secondary {
  background: #eef1f4;
  color: #17202a;
}

.hidden {
  display: none;
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div id="page1" class="page">
  <div class="card">
    <h1>📅 Mon Planning</h1>

    <p>Choisis une date de référence.</p>

    <input type="date" id="dateDepart">

    <button onclick="voirPlanning()">
      Voir mon planning →
    </button>
  </div>
</div>


<!-- PAGE 2 -->
<div id="page2" class="page hidden">
  <div class="card">

    <h1>Mon Planning</h1>

    <div id="dateAffichee" class="date"></div>

    <div id="resultat" class="result"></div>

    <button class="secondary" onclick="retour()">
      ← Changer la date
    </button>

  </div>
</div>


<script>

const dateParDefaut = "2026-09-17";

const champ = document.getElementById("dateDepart");

const dateSauvegardee = localStorage.getItem("datePlanning");

champ.value = dateSauvegardee || dateParDefaut;


function calculerPlanning(dateChoisie) {

  const depart = new Date(dateParDefaut + "T00:00:00");
  const date = new Date(dateChoisie + "T00:00:00");

  const difference = Math.floor(
    (date - depart) / (1000 * 60 * 60 * 24)
  );

  const cycle = ((difference % 9) + 9) % 9;

  if (cycle < 3) {
    return "☀️ Service jour " + (cycle + 1) + "/3";
  }

  if (cycle < 6) {
    return "🌙 Service nuit " + (cycle - 2) + "/3";
  }

  return "🛌 Repos " + (cycle - 5) + "/3";
}


function voirPlanning() {

  const dateChoisie = champ.value;

  if (!dateChoisie) {
    return;
  }

  localStorage.setItem("datePlanning", dateChoisie);

  afficherPlanning(dateChoisie);
}


function afficherPlanning(dateChoisie) {

  const resultat = calculerPlanning(dateChoisie);

  const date = new Date(dateChoisie + "T00:00:00");

  const dateFormatee = date.toLocaleDateString(
    "fr-FR",
    {
      weekday: "long",
      day: "numeric",
      month: "long",
      year: "numeric"
    }
  );

  document.getElementById("dateAffichee").textContent =
    dateFormatee;

  document.getElementById("resultat").textContent =
    resultat;

  document.getElementById("page1").classList.add("hidden");
  document.getElementById("page2").classList.remove("hidden");
}


function retour() {

  document.getElementById("page2").classList.add("hidden");
  document.getElementById("page1").classList.remove("hidden");

}

</script>

</body>
</html>
